
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelera-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
